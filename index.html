<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exp3er1mentz H3art</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <div class="screen">

        <!-- Floating hearts -->
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>

        <!-- TITLE -->
        <section id="titleScreen">
            <div class="glitch">Exp3er1mentz H3art</div>
            <div class="subtitle">CLASSIFIED EXPERIMENT // FILE 001</div>
            <button class="startButton" onclick="startGame()">BEGIN EXPERIMENT</button>
            <div class="warning">PROPERTY OF THE AGENCY. UNAUTHORIZED ACCESS IS PROHIBITED.</div>
        </section>

        <!-- GAME -->
        <section id="gameScreen">

            <div class="topBar">
                <span class="location">█ <span id="locationName">AGENCY OFFICE</span></span>
                <span>EXPERIMENT STATUS: <b id="status">STABLE</b></span>
            </div>

            <div class="mainArea bg-office" id="mainArea">
                <div class="fx-layer" id="fxLayer"></div>
                <div class="char-layer" id="charLayer"></div>
                <div class="labFloor"></div>
            </div>

            <div class="dialogueBox" id="dialogueBox">
                <div class="speaker" id="speaker">SYSTEM</div>
                <div class="dialogueText" id="dialogue">Initializing experiment...</div>
                <div class="choices" id="choices"></div>
                <div class="continue" id="continue">CLICK TO CONTINUE</div>
            </div>

        </section>

    </div>

</div>

<script src="sprites.js"></script>
<script src="story.js"></script>
<script src="game.js"></script>

</body>
</html>
