<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exp3er1mentz H3art</title>

<style>
/* =====================================================
   EXP3ER1MENTZ H3ART
   Yandere Pink × Genshin Edition
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #1a0814;
    color: #f5d0dc;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

/* GAME */

#game {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at center, #3d1a35 0%, #1a0814 70%);
}

/* Floating hearts */

.heart-particle {
    position: absolute;
    color: rgba(255, 107, 157, .35);
    pointer-events: none;
    z-index: 0;
    animation: floatUp 8s linear infinite;
}

.heart-particle:nth-child(1) { left:  8%; animation-delay: 0s;   font-size: 16px; }
.heart-particle:nth-child(2) { left: 22%; animation-delay: 2.5s; font-size: 22px; }
.heart-particle:nth-child(3) { left: 40%; animation-delay: 5s;   font-size: 14px; }
.heart-particle:nth-child(4) { left: 58%; animation-delay: 1.5s; font-size: 20px; }
.heart-particle:nth-child(5) { left: 75%; animation-delay: 3.5s; font-size: 18px; }
.heart-particle:nth-child(6) { left: 90%; animation-delay: 6s;   font-size: 24px; }

@keyframes floatUp {
    0%   { bottom: -30px;  opacity: 0; }
    10%  {                opacity: 1; }
    90%  {                opacity: 1; }
    100% { bottom: 105%;  opacity: 0; }
}

.screen {
    width: min(1000px, 94vw);
    min-height: 650px;
    border: 2px solid #d4a574;
    background: #1e0a1c;
    box-shadow:
        0 0 0 4px #1a0814,
        0 0 0 6px #b8860b,
        0 0 30px rgba(255, 107, 157, .3),
        0 0 60px rgba(255, 107, 157, .15);
    position: relative;
    overflow: hidden;
}

/* =====================================================
   TITLE SCREEN
   ===================================================== */

#titleScreen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
}

.glitch {
    font-size: clamp(30px, 6vw, 65px);
    color: #fff0f5;
    letter-spacing: 4px;
    text-shadow:
        3px 0 #ff1493,
        -3px 0 #b03060;
    animation: glitch 3s infinite;
}

.subtitle {
    color: #d4a0b0;
    margin-top: 5px;
    font-size: 14px;
    letter-spacing: 2px;
}

.startButton {
    margin-top: 60px;
    padding: 16px 35px;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    border: 2px solid #d4a574;
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(255, 107, 157, .4);
    transition: all .3s;
}

.startButton:hover {
    background: linear-gradient(135deg, #ff8fb1, #e0568a);
    border-color: #ffd700;
    box-shadow: 0 0 30px rgba(255, 107, 157, .6);
    transform: scale(1.05);
}

.warning {
    margin-top: 35px;
    color: #a06070;
    font-size: 11px;
    max-width: 500px;
}

@keyframes glitch {
    0%, 90%, 100% {
        transform: translate(0);
    }

    92% {
        transform: translate(-2px, 1px);
    }

    94% {
        transform: translate(2px, -1px);
    }
}

/* =====================================================
   GAME SCREEN
   ===================================================== */

#gameScreen {
    display: none;
    flex-direction: column;
}

.topBar {
    height: 48px;
    border-bottom: 2px solid #d4a574;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    color: #d4a0b0;
    font-size: 12px;
    background: rgba(196, 69, 105, .12);
}

.location {
    color: #ff6b9d;
}

.mainArea {
    flex: 1;
    position: relative;
    min-height: 470px;
    background:
        linear-gradient(
            rgba(255, 107, 157, .02) 50%,
            transparent 50%
        );
    background-size: 100% 4px;
}

/* Laboratory floor */

.labFloor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 110px;
    background:
        repeating-linear-gradient(
            90deg,
            #2a1020 0px,
            #2a1020 48px,
            #1e0a18 49px,
            #1e0a18 50px
        );
    border-top: 2px solid #d4a574;
}

/* =====================================================
   CSS PIXEL PEOPLE — chibi yandere style
   ===================================================== */

.character {
    position: absolute;
    width: 100px;
    height: 180px;
    bottom: 65px;
    animation: bob 2.5s ease-in-out infinite;
}

@keyframes bob {
    0%, 100% { bottom: 65px; }
    50% { bottom: 70px; }
}

/* Scientist */

.scientist {
    left: 17%;
}

/* Subject */

.subject {
    right: 18%;
    opacity: .85;
    animation-delay: .6s;
}

/* Head — big chibi head */

.head {
    position: absolute;
    width: 76px;
    height: 66px;
    left: 12px;
    top: 0;
    background: #fce0ce;
    border: 2px solid #8b3a5a;
    border-radius: 36px 36px 28px 28px;
    z-index: 3;
}

/* Scientist hair — pink yandere */

.scientist .head::before {
    content: "";
    position: absolute;
    width: 80px;
    height: 26px;
    left: -2px;
    top: -8px;
    background: #ff6b9d;
    border: 2px solid #8b3a5a;
    border-radius: 40px 40px 4px 4px;
}

/* Subject hair — lavender pink */

.subject .head::before {
    content: "";
    position: absolute;
    width: 76px;
    height: 14px;
    left: -2px;
    top: -4px;
    background: #c8a2d4;
    border: 2px solid #8b3a5a;
    border-radius: 38px 38px 0 0;
}

/* Big cute eyes with pink sparkles */

.head::after {
    content: "";
    position: absolute;
    left: 18px;
    top: 30px;
    width: 12px;
    height: 14px;
    background: #8b3a5a;
    border-radius: 50%;
    box-shadow:
        28px 0 #8b3a5a,
        3px 3px 0 1px #ffb7c5,
        31px 3px 0 1px #ffb7c5;
}

/* Blush cheeks */

.blush {
    position: absolute;
    width: 12px;
    height: 7px;
    background: rgba(255, 107, 157, .5);
    border-radius: 50%;
    top: 46px;
    left: 12px;
    z-index: 4;
    box-shadow: 44px 0 rgba(255, 107, 157, .5);
}

/* Body — small chibi body */

.body {
    position: absolute;
    top: 64px;
    left: 22px;
    width: 56px;
    height: 44px;
    background: #fff0f5;
    border: 2px solid #8b3a5a;
    border-radius: 10px 10px 6px 6px;
    z-index: 2;
}

/* Scientist lab coat */

.scientist .body {
    background: #ffe0ec;
}

/* Subject clothing */

.subject .body {
    background: #5a2a4a;
}

/* Arms — short stubby */

.arm {
    position: absolute;
    top: 70px;
    width: 14px;
    height: 32px;
    background: #fce0ce;
    border: 2px solid #8b3a5a;
    border-radius: 7px;
    z-index: 1;
}

.arm.left {
    left: 8px;
}

.arm.right {
    right: 8px;
}

/* Legs — short stubby */

.leg {
    position: absolute;
    top: 106px;
    width: 18px;
    height: 30px;
    background: #4a1a3a;
    border: 2px solid #6b2a4a;
    border-radius: 6px 6px 4px 4px;
    z-index: 1;
}

.leg.left {
    left: 26px;
}

.leg.right {
    right: 26px;
}

/* =====================================================
   DIALOGUE
   ===================================================== */

.dialogueBox {
    min-height: 135px;
    background: #1e0a1c;
    border-top: 2px solid #d4a574;
    padding: 18px 22px;
    box-shadow: inset 0 4px 12px rgba(255, 107, 157, .08);
}

.speaker {
    color: #ff6b9d;
    font-weight: bold;
    margin-bottom: 8px;
    text-shadow: 0 0 8px rgba(255, 107, 157, .5);
}

.dialogueText {
    line-height: 1.6;
    color: #f5d0dc;
    min-height: 50px;
}

.continue {
    margin-top: 12px;
    color: #d4a0b0;
    font-size: 12px;
}

/* =====================================================
   CHOICES
   ===================================================== */

.choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
}

.choice {
    flex: 1;
    min-width: 200px;
    padding: 12px;
    background: #2a1020;
    color: #f5d0dc;
    border: 1px solid #d4a574;
    cursor: pointer;
    text-align: left;
    border-radius: 4px;
    transition: all .3s;
}

.choice:hover {
    background: #3d1a30;
    border-color: #ff6b9d;
    box-shadow: 0 0 15px rgba(255, 107, 157, .3);
    color: #fff0f5;
}

/* =====================================================
   STATUS
   ===================================================== */

.status {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #a06080;
    font-size: 11px;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 650px) {

    .screen {
        width: 100%;
        min-height: 100vh;
        border: none;
    }

    .mainArea {
        min-height: 430px;
    }

    .scientist {
        left: 8%;
    }

    .subject {
        right: 8%;
    }

    .character {
        transform: scale(.75);
        transform-origin: bottom center;
    }

    .dialogueBox {
        min-height: 190px;
    }

    .choice {
        min-width: 100%;
    }
}
</style>
</head>
<body>

<div id="game">

    <div class="screen">

        <!-- Floating hearts -->

        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>
        <div class="heart-particle">♥</div>

        <!-- TITLE -->

        <section id="titleScreen">

            <div class="glitch">
                Exp3er1mentz H3art
            </div>

            <div class="subtitle">
                CLASSIFIED EXPERIMENT // FILE 001
            </div>

            <button class="startButton" onclick="startGame()">
                BEGIN EXPERIMENT
            </button>

            <div class="warning">
                PROPERTY OF THE AGENCY.
                UNAUTHORIZED ACCESS IS PROHIBITED.
            </div>

        </section>


        <!-- GAME -->

        <section id="gameScreen">

            <div class="topBar">

                <span class="location">
                    █ LABORATORY 07
                </span>

                <span>
                    EXPERIMENT STATUS:
                    <b id="status">STABLE</b>
                </span>

            </div>


            <div class="mainArea">

                <div class="status">
                    SUBJECT: 001
                </div>

                <div class="labFloor"></div>


                <!-- SCIENTIST -->

                <div class="character scientist">

                    <div class="head"></div>
                    <div class="blush"></div>

                    <div class="body"></div>

                    <div class="arm left"></div>
                    <div class="arm right"></div>

                    <div class="leg left"></div>
                    <div class="leg right"></div>

                </div>


                <!-- SUBJECT -->

                <div class="character subject">

                    <div class="head"></div>
                    <div class="blush"></div>

                    <div class="body"></div>

                    <div class="arm left"></div>
                    <div class="arm right"></div>

                    <div class="leg left"></div>
                    <div class="leg right"></div>

                </div>

            </div>


            <div class="dialogueBox">

                <div class="speaker" id="speaker">
                    SYSTEM
                </div>

                <div class="dialogueText" id="dialogue">
                    Initializing experiment...
                </div>

                <div class="choices" id="choices"></div>

                <div class="continue" id="continue">
                    CLICK TO CONTINUE
                </div>

            </div>

        </section>

    </div>

</div>


<script>

/* =====================================================
   STORY SYSTEM
   ===================================================== */

const story = {

    start: {
        speaker: "YOU",
        text:
        "Another day. Another experiment. Another report nobody will ever read.",
        next: "boring"
    },

    boring: {
        speaker: "YOU",
        text:
        "The agency calls it important work. You call it Tuesday.",
        next: "classified"
    },

    classified: {
        speaker: "DIRECTOR",
        text:
        "\"Doctor. We have a new assignment for you.\"",
        next: "secret"
    },

    secret: {
        speaker: "DIRECTOR",
        text:
        "\"This project is classified. You will not discuss it with anyone.\"",
        next: "subject"
    },

    subject: {
        speaker: "YOU",
        text:
        "They bring the body into the laboratory after midnight.",
        next: "body"
    },

    body: {
        speaker: "YOU",
        text:
        "You have seen hundreds of failed experiments. This one feels different.",
        next: "experiment"
    },

    experiment: {
        speaker: "SYSTEM",
        text:
        "EXPERIMENT 001 — BEGIN.",
        choices: [
            {
                text: "Begin the procedure.",
                next: "procedure"
            },
            {
                text: "Look at the subject first.",
                next: "look"
            }
        ]
    },

    look: {
        speaker: "YOU",
        text:
        "You stare at their face. For some reason, you can't look away.",
        next: "procedure"
    },

    procedure: {
        speaker: "SYSTEM",
        text:
        "Power increasing... biological response detected...",
        next: "wake"
    },

    wake: {
        speaker: "SYSTEM",
        text:
        "HEARTBEAT DETECTED.",
        next: "eyes"
    },

    eyes: {
        speaker: "YOU",
        text:
        "Their eyes open.",
        next: "stare"
    },

    stare: {
        speaker: "YOU",
        text:
        "They look directly at you.",
        choices: [
            {
                text: "Step closer.",
                next: "closer"
            },
            {
                text: "Stay where you are.",
                next: "distance"
            }
        ]
    },

    closer: {
        speaker: "YOU",
        text:
        "You step closer. Something about them feels strangely familiar.",
        next: "hug"
    },

    distance: {
        speaker: "YOU",
        text:
        "You don't move. You tell yourself you're only observing the experiment.",
        next: "question"
    },

    hug: {
        speaker: "YOU",
        text:
        "Before you can think about it, you pull them into a hug.",
        next: "question"
    },

    question: {
        speaker: "SUBJECT",
        text:
        "\"Who are you?\"",
        choices: [
            {
                text: "Tell them your real name.",
                next: "realname"
            },
            {
                text: "Tell them your agency identification.",
                next: "agency"
            }
        ]
    },

    realname: {
        speaker: "YOU",
        text:
        "You tell them your name.",
        next: "memory"
    },

    agency: {
        speaker: "YOU",
        text:
        "\"I'm the scientist who brought you back.\"",
        next: "memory"
    },

    memory: {
        speaker: "SUBJECT",
        text:
        "\"I don't remember anything...\"",
        next: "ending"
    },

    ending: {
        speaker: "YOU",
        text:
        "You should be documenting the experiment. Instead, you're watching them breathe.",
        choices: [
            {
                text: "Continue the experiment.",
                next: "continueExperiment"
            },
            {
                text: "Protect the subject.",
                next: "protect"
            }
        ]
    },

    continueExperiment: {
        speaker: "SYSTEM",
        text:
        "NEW EXPERIMENT PARAMETERS REQUIRED.",
        next: "final"
    },

    protect: {
        speaker: "YOU",
        text:
        "For the first time in your career, you decide the agency doesn't get to decide what happens next.",
        next: "final"
    },

    final: {
        speaker: "SYSTEM",
        text:
        "END OF DEMO — THE EXPERIMENT HAS ONLY JUST BEGUN.",
        choices: [
            {
                text: "Restart",
                next: "restart"
            }
        ]
    }

};


/* =====================================================
   GAME VARIABLES
   ===================================================== */

let currentScene = "start";


/* =====================================================
   START
   ===================================================== */

function startGame() {

    document.getElementById("titleScreen").style.display = "none";

    document.getElementById("gameScreen").style.display = "flex";

    showScene("start");
}


/* =====================================================
   SHOW SCENE
   ===================================================== */

function showScene(sceneName) {

    if (sceneName === "restart") {

        location.reload();

        return;
    }

    currentScene = sceneName;

    const scene = story[sceneName];

    const speaker =
        document.getElementById("speaker");

    const dialogue =
        document.getElementById("dialogue");

    const choices =
        document.getElementById("choices");

    const continueText =
        document.getElementById("continue");

    speaker.textContent = scene.speaker;

    dialogue.textContent = scene.text;

    choices.innerHTML = "";

    continueText.style.display = "none";


    /* Choices */

    if (scene.choices) {

        scene.choices.forEach(choice => {

            const button =
                document.createElement("button");

            button.className = "choice";

            button.textContent = choice.text;

            button.onclick = () => {

                showScene(choice.next);

            };

            choices.appendChild(button);

        });

    }

    /* Normal continuation */

    else if (scene.next) {

        continueText.style.display = "block";

        continueText.textContent =
            "CLICK TO CONTINUE";

        document.getElementById("dialogueBox");

        continueText.onclick = () => {

            showScene(scene.next);

        };

        continueText.style.cursor = "pointer";

    }

}


/* =====================================================
   KEYBOARD SUPPORT
   ===================================================== */

document.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        const scene = story[currentScene];

        if (scene && scene.next && !scene.choices) {

            showScene(scene.next);

        }

    }

});

</script>

</body>
</html>
